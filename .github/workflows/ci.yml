name: CI/CD

# Every push and pull request is tested. A version tag (v1.2.3) is also built
# into images, pushed to GitHub Container Registry, and deployed to the server
# over SSH from a GitHub-hosted runner, with the tests in front so a broken
# build never reaches the server. No runner lives on the server: in a public
# repository, a pull request could otherwise run its own code there.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    # A disposable database for the store tests (pool retention is SQL, so it is
    # tested against Postgres itself). Without it those tests skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      EARLYPAIR_TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -count=1 ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Before setup-node: its pnpm cache asks pnpm where the store is, and
      # pnpm has to be the same one that then installs into it. The version is
      # the one package.json pins in packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  build-and-push:
    name: Build and push images
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/early-pair2-backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/early-pair2-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.names.outputs.backend }}:${{ github.ref_name }}
            ${{ steps.names.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Public, not a secret: it is compiled into the page either way.
          build-args: VITE_WALLETCONNECT_ID=${{ vars.VITE_WALLETCONNECT_ID }}
          tags: |
            ${{ steps.names.outputs.web }}:${{ github.ref_name }}
            ${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to server
    needs: build-and-push
    runs-on: ubuntu-24.04
    # Only tag pushes get here (build-and-push is gated on them), and pushing a
    # tag needs write access, so the SSH key is never handed to a fork's code.
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/github/early-pair2' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      # The host, user and port are secrets too, so the server's address is
      # masked in the public logs.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER || 'github' }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::Set the DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and DEPLOY_HOST secrets (see DEPLOY.md)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the deploy files
        run: |
          ssh server "mkdir -p $(printf %q "$DEPLOY_DIR")"
          scp deploy/docker-compose.yml deploy/deploy.sh "server:$DEPLOY_DIR/"

      - name: Log in to GitHub Container Registry on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh server docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ssh server "bash $(printf %q "$DEPLOY_DIR/deploy.sh") $(printf %q "$TAG") $(printf %q "$owner")"

      - name: Log out of the registry on the server
        if: always()
        run: ssh server docker logout ghcr.io || true
