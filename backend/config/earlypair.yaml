  # Robinhood Chain: an Arbitrum Orbit L2. Chain id, Multicall3 and the explorer
  # were verified against the public RPC.
  #
  # Blocks land every ~100ms (measured 0.101s over 10,000 blocks). blockTime is
  # that real value, because it sizes every wall-clock window; at the earlier
  # 1s the "last hour" of trades would have been six minutes. Polling stays at
  # 1s via pollInterval, so the public RPC budget is not spent on empty ranges.
  #
  # Discovery is Uniswap v4 only. Every address below was verified on-chain:
  #   - PoolManager: the sole emitter of v4 Initialize events (293 in 20,000
  #     blocks); its bytecode matches Base's PoolManager except the 20 bytes
  #     where each contract embeds its own address; its swaps follow the v4
  #     sign convention (1,330 of 1,330).
  #   - WETH: holds 41,073 ETH against a 41,073 supply, so it is the real wrapper.
  #   - USDG (Paxos Global Dollar, 6 decimals): the only stablecoin among every
  #     currency used by recent pools.
  # No nativePriceRef: there is no v2-style WETH/USDG pool to read, so USD values
  # for ETH-quoted pools stay null rather than guessed. USDG-quoted pools price.
  - id: rbn
    name: Robinhood
    tag: RBN
    kind: evm
    numericId: 4663
    enabled: true
    blockTime: 100ms
    pollInterval: 1s
    confirmations: 80
    # 500 blocks is under a minute here, and the single endpoint's 5 req/s could
    # not sweep, confirm and catch up in steps that small: the cursor fell 40
    # minutes behind, and pairs found that late are never market-tracked. The
    # endpoint serves address-filtered 5,000-block queries (verified), so both
    # live sweeps and catch-ups use that width.
    maxLogRange: 5000
    backfillChunk: 5000
    explorer: "https://robinhoodchain.blockscout.com"
    nativeSymbol: ETH
    multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    # Robinhood's Universal Router takes the older exact-input layout, with a
    # uint256 (its minHopPriceX36) before hookData.
    uniswapV4:
      quoter: "0x8dc178efb8111bb0973dd9d722ebeff267c98f94"
      universalRouter: "0x8876789976decbfcbbbe364623c63652db8c0904"
      permit2: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
      stateView: "0xf3334192d15450cdd385c8b70e03f9a6bd9e673b"
      extraSwapParam: true
    wrappedNative: "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
    stables:
      - "0x5fc5360d0400a0fd4f2af552add042d716f1d168"  # USDG
    factories:
      - address: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
        dex: "Uniswap v4"
        model: clmm
        event: initialize_v4

  # Arc is Circle's L1 where gas is paid in USDC, so there is no wrapped native
  # token: the gas balance has a 6-decimal ERC-20 interface at 0x3600…0000
  # (symbol USDC, verified on-chain), and pools pair against that address. The
  # native price needs no reference pool — a dollar is a dollar.
  - id: arc
    name: Arc
    tag: ARC
    kind: evm
    numericId: 5042
    enabled: true
    # Measured 0.51s over 2,000 blocks on 2026-09-16. Confirmations keep a ~30s
    # depth, in line with the other fast chains.
    blockTime: 500ms
    pollInterval: 1s
    confirmations: 60
    # Blockdaemon serves 20,000-block ranges; dRPC's free tier refuses over
    # 10,000. 2,000 keeps both happy, and at ~1,000 new v3 pools every 20,000
    # blocks it keeps responses small.
    maxLogRange: 2000
    backfillChunk: 2000
    explorer: "https://explorer.arc.io"
    nativeSymbol: USDC
    nativeIsStable: true
    multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"
    # Uniswap's published Arc deployment. Checked on-chain: poolManager() on
    # both the quoter and the Universal Router returns this PoolManager.
    uniswapV4:
      quoter: "0x8dc178efb8111bb0973dd9d722ebeff267c98f94"
      universalRouter: "0x4fca4a51ab4f23a7447b3284fbd7d73289a89fb1"
      permit2: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
      # StateView reads a v4 pool's price, liquidity and ticks by id, for the
      # depth chart. Checked on-chain: poolManager() returns this chain's
      # PoolManager.
      stateView: "0xf3334192d15450cdd385c8b70e03f9a6bd9e673b"
      # Arc's router takes the same older exact-input layout as Robinhood's,
      # read off a swap that succeeded on-chain here. Without it hookData is
      # decoded from the wrong offset: hookless pools ignore the garbage and
      # swap anyway, hooked pools revert — which is how it first showed up.
      extraSwapParam: true
    # Uniswap v3 on Arc. Checked on-chain: factory() on both the QuoterV2 and
    # SwapRouter02 returns the v3 factory configured below.
    uniswapV3:
      quoter: "0x7dfd4f31be6814d2906bde155c3e1b146eac1468"
      swapRouter: "0x53bf6b0684ec7ef91e1387da3d1a1769bc5a6f77"
    stables:
      - "0x3600000000000000000000000000000000000000"  # USDC, the gas token's ERC-20
    factories:
      - address: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
        dex: "Uniswap v4"
        model: clmm
        event: initialize_v4
      # Checked on-chain: feeAmountTickSpacing(3000)=60 and (500)=10, and it is
      # the busier of the two on Arc today.
      - address: "0xf0db7b58379503491d857db50ac9ece64c653918"
        dex: "Uniswap v3"
        model: clmm
        event: pool_created_v3

  # Solana and SUI are configured but disabled: their ingesters are not
