endpoints:
  # At least two HTTP endpoints per chain, so hedging has somewhere to go and
  # one provider's outage is not the chain's outage. Rate limits are set
  # conservatively: guessing high on a free tier is how you get soft-banned.
  - id: eth-http-publicnode
    chain: eth
    transport: http
    url: "https://ethereum-rpc.publicnode.com"
    rateLimit: 8
    weight: 2
  - id: eth-http-llamarpc
    chain: eth
    transport: http
    url: "https://eth.llamarpc.com"
    rateLimit: 5
  - id: eth-http-drpc
