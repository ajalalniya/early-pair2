# EarlyPair configuration.
#
# Everything here runs against free public endpoints with no API keys. That is
# the design constraint the whole ingestion architecture follows from: these
# providers rate-limit hard, cap eth_getLogs ranges without documenting it, drop
# WebSockets without warning, and sometimes serve a stale head. Assume each of
# them can vanish; the system is meant to stay green on N-1.
#
# Secrets never belong in this file. Per-endpoint URLs can be overridden with
# EARLYPAIR_RPC_URL_<ID> (id upper-snaked), and explorer keys with
# EARLYPAIR_EXPLORER_KEY_<CHAIN>.

server:
  addr: ":8080"
  metricsAddr: ":9090"
  corsOrigins:
    - "http://localhost:5173"
  publicCacheTtl: 2s

database:
  url: "postgres://earlypair:earlypair@localhost:5432/earlypair?sslmode=disable"
  autoMigrate: true

redis:
  url: "redis://localhost:6379/0"

log:
  level: info
  format: text

rpc:
  hedgeAfter: 400ms
  maxHedges: 2
  requestTimeout: 12s
  breakerFailures: 5
  breakerProbeAfter: 30s
  headLagEvictBlocks: 3
  headLagEvictFor: 30s
  # The UI tells users "auto-resubscribe on socket close, HTTP fallback after
  # 2 drops". These are the numbers behind that sentence.
  wsDropsBeforeDemote: 2
  wsDropWindow: 10m
  wsDemoteFor: 15m
  wsBackoffMin: 500ms
  wsBackoffMax: 30s

ingest:
  # A start begins at the chain head: pairs created while the indexer was
  # stopped are skipped, not swept. Set true to resume from the stored cursor
  # instead (catching up at most maxBackfillBlocks).
  resumeOnStart: false
  # A cursor further behind than this jumps to head rather than grinding
  # through hours of history and then flooding the feed with stale pairs.
  maxBackfillBlocks: 50000
  backfillChunk: 200
  doorbellDebounce: 150ms
  confirmCheckEvery: 15s
  # Workers are shared across chains and each pool's enrichment is mostly
  # waiting on round trips, so this is what decides how fast a new pair gets its
  # tokens — and a pair cannot be market-tracked until it has them. Eight left
  # 200 Arc pairs queued at ~75 new pairs a minute while the RPC budget sat
  # three-quarters idle.
  enrichWorkers: 24
  # New pairs have their liquidity, 1h volume, buyers/sellers and 1h price
  # change kept live for this long after creation, then frozen. Tracking every
  # pool forever is what a public RPC budget cannot pay for. Favorites (starred
  # pairs) are the exception: they are tracked until unstarred.
  trackWindow: 10m
  trackEvery: 3s
  # Three minutes after creation each pair is judged. With keepIf: both, a pair
  # is removed when liquidity is under minLiquidityUsd OR volume is under
  # minVolumeUsd; with keepIf: either it is removed only when both fall short.
  # A dollar figure that cannot be established counts as not clearing.
  # Survivors are tracked for the rest of trackWindow.
  screen:
    after: 3m
    minLiquidityUsd: 10000
    minVolumeUsd: 100
    keepIf: both
  enrichQueueSize: 4096
  # Pools older than this are deleted, with their reserves, risk history and
  # swaps, so the database stays bounded — Arc alone launches thousands of pairs
  # a day. Starred pools (including those added by address) and pools someone
  # traded are always kept. 0 keeps everything. EARLYPAIR_POOL_RETENTION
  # overrides it without a rebuild, e.g. 72h.
  poolRetention: 48h

stream:
  replayWindow: 5m
  replayMaxFrames: 20000
  clientQueue: 512
  pingInterval: 20s
  coalesceWindow: 250ms

auth:
  # Set EARLYPAIR_JWT_SECRET in the environment; the API refuses to start
  # without it rather than failing per request.
  jwtSecret: ""
  sessionTtl: 24h
  nonceTtl: 5m
  domain: "localhost"

risk:
  sellersThin: 14
  ratioHigh: 20
  lpUnlocked: 22
  lpShortLock: 10
  mintActive: 20
  taxNonZero: 8
  taxPunitive: 18
  topHeavyMild: 10
  topHeavy: 14
  topHeavySevere: 20
  topHeavyExtreme: 26
  fewHolders: 8
  unverified: 6
  # A sell that reverts in simulation means the position cannot be exited at
  # all, so this alone has to clear the gate threshold.
  honeypotSimFailed: 70
  # A pool charging 25%+ on every trade (a Uniswap v4 setting) gates on its own.
  poolFeeExtreme: 70
  gateThreshold: 60

explorers:
  eth:
    api: "https://api.etherscan.io/api"
    apiKey: ""   # EARLYPAIR_EXPLORER_KEY_ETH
  base:
    api: "https://api.basescan.org/api"
    apiKey: ""   # EARLYPAIR_EXPLORER_KEY_BASE
  bsc:
    api: "https://api.bscscan.com/api"
    apiKey: ""   # EARLYPAIR_EXPLORER_KEY_BSC
  arb:
    api: "https://api.arbiscan.io/api"
    apiKey: ""   # EARLYPAIR_EXPLORER_KEY_ARB

