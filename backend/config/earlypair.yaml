    rateLimit: 10

  # Only one public endpoint is known for Robinhood so far, so hedging has
  # nowhere to go; add a second through the UI or here when one exists.
  - id: rbn-http-official
    chain: rbn
    transport: http
    url: "https://rpc.mainnet.chain.robinhood.com/"
    rateLimit: 5
    weight: 2

  # Arc. Circle's own endpoint, https://rpc.mainnet.arc.io, answers Cloudflare
  # error 1009 (region blocked) from this host, so it is disabled rather than
  # left to fail every request; enable it where it is reachable. The two below
  # were verified from here: both return chainId 0x13b2.
  # Arc mints pairs far faster than the other chains — around 75 a minute — and
  # every one needs its tokens read before it can be tracked, so the whole feed
  # is as fresh as the request budget allows. These limits were measured, not
  # guessed: 20/s to Blockdaemon and 15/s to dRPC, sustained for 15s, returned
  # 525 responses and no errors.
  - id: arc-http-blockdaemon
    chain: arc
    transport: http
    url: "https://rpc.blockdaemon.mainnet.arc.io"
    rateLimit: 20
    burst: 20
    weight: 2
