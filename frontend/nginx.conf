# Serves the app and forwards the API to the backend container ("api").
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved at request time: a recreated api
    # container gets a new address, and nginx would otherwise keep the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # The live feed is a long-lived WebSocket.
    location /api/v1/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Readiness of the whole stack, for the deploy check: the backend answers
    # only when it can reach its database.
    location = /healthz {
        proxy_pass $api/readyz;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/pools, /portfolio) all load the app shell, which is
    # never cached so a new release is picked up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
